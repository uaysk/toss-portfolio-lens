services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    env_file:
      - path: .env
        required: false
      - path: .env.scalping
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3200"
      # Web admission, live streams, simulation sessions, and snapshot scheduling
      # are process-local. Any declared value other than one fails startup.
      APP_REPLICA_COUNT: ${APP_REPLICA_COUNT:-1}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://tpl.uaysk.com}
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      POSTGRES_URL: ${POSTGRES_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      POSTGRES_SSL_CA_PATH: ${POSTGRES_SSL_CA_PATH:-}
      REPORTS_PATH: /app/data/reports
      SNAPSHOT_REFRESH_HOURS: "6"
      EXECUTION_MODE: ${EXECUTION_MODE:-rust_socket}
      RUST_COMPUTE_SOCKET: /app/run/compute.sock
      # The control plane only dials this socket when SCALPING_ENABLED=true.
      SCALPING_ENABLED: ${SCALPING_ENABLED:-false}
      AI_FINCAST_COMPUTE_URL: ${AI_FINCAST_COMPUTE_URL:-ws://fincast-worker:8766/ws/scalping-ai/v2}
      AI_FINCAST_COMPUTE_AUTH_TOKEN_FILE: /run/fincast-auth/token
      AI_CHRONOS2_COMPUTE_URL: ${AI_CHRONOS2_COMPUTE_URL:-}
      AI_CHRONOS2_COMPUTE_AUTH_TOKEN_FILE: /run/chronos2-auth/token
      AI_FINCAST_COMPUTE_ALLOW_INSECURE_PRIVATE_WS: ${AI_FINCAST_COMPUTE_ALLOW_INSECURE_PRIVATE_WS:-false}
      AI_CHRONOS2_COMPUTE_ALLOW_INSECURE_PRIVATE_WS: ${AI_CHRONOS2_COMPUTE_ALLOW_INSECURE_PRIVATE_WS:-false}
      AI_FINCAST_COMPUTE_MAX_IN_FLIGHT: "1"
      AI_CHRONOS2_COMPUTE_MAX_IN_FLIGHT: "1"
      AI_FINCAST_COMPUTE_TLS_CA_FILE: ${AI_FINCAST_COMPUTE_TLS_CA_FILE:-}
      AI_CHRONOS2_COMPUTE_TLS_CA_FILE: ${AI_CHRONOS2_COMPUTE_TLS_CA_FILE:-}
      TZ: Asia/Seoul
    group_add:
      - "${AI_FINCAST_AUTH_SECRET_GID:-1000}"
    extra_hosts:
      - "${POSTGRES_HOST:-postgres.internal}:${POSTGRES_DOCKER_HOST_IP:-host-gateway}"
    ports:
      - "0.0.0.0:3200:3200"
    restart: unless-stopped
    stop_grace_period: 35s
    init: true
    volumes:
      - portfolio_data:/app/data
      - compute_socket:/app/run
      - ${AI_FINCAST_AUTH_SECRET_SOURCE:-fincast_auth}:/run/fincast-auth:ro
      - ${AI_CHRONOS2_AUTH_SECRET_SOURCE:-chronos2_auth}:/run/chronos2-auth:ro
      - ${AI_TLS_SECRET_SOURCE:-ai_tls}:/run/ai-tls:ro
      - ${POSTGRES_CA_HOST_PATH:-/dev/null}:/app/certs/cnpg-ca.crt:ro
    networks:
      - default
      - ai_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      compute-ipc:
        condition: service_healthy

  compute-worker:
    profiles: ["external-compute"]
    image: ${RUST_WORKER_IMAGE:-toss-portfolio-lens-rust-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker.rust
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      POSTGRES_SSL_CA_PATH: ${POSTGRES_SSL_CA_PATH:-}
      WORKER_ID: ${RUST_WORKER_ID:-compose-rust-worker}
      WORKER_POLL_MS: ${RUST_WORKER_POLL_MS:-250}
      WORKER_LEASE_MS: ${RUST_WORKER_LEASE_MS:-30000}
      WORKER_HEARTBEAT_MS: ${RUST_WORKER_HEARTBEAT_MS:-5000}
      WORKER_RECOVERY_MS: ${RUST_WORKER_RECOVERY_MS:-10000}
      TZ: Asia/Seoul
    extra_hosts:
      - "${POSTGRES_HOST:-postgres.internal}:${POSTGRES_DOCKER_HOST_IP:-host-gateway}"
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${POSTGRES_CA_HOST_PATH:-/dev/null}:/app/certs/cnpg-ca.crt:ro

  compute-ipc:
    image: ${RUST_WORKER_IMAGE:-toss-portfolio-lens-rust-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker.rust
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    command:
      [
        "serve",
        "--socket",
        "/app/run/compute.sock",
        "--max-active",
        "${RUST_COMPUTE_POOL_SIZE:-2}",
        "--max-connections",
        "34",
      ]
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped
    init: true
    volumes:
      - compute_socket:/app/run
    healthcheck:
      test: ["CMD", "/usr/local/bin/portfolio-lens-worker", "health", "--socket", "/app/run/compute.sock"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  fincast-worker:
    # FinCast is the default production AI worker.
    image: ${AI_FINCAST_WORKER_IMAGE:-toss-portfolio-lens-fincast-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker.fincast
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    command: ["serve"]
    environment:
      AI_WEBSOCKET_HOST: 0.0.0.0
      AI_WEBSOCKET_PORT: "8766"
      AI_WEBSOCKET_PATH: /ws/scalping-ai/v2
      AI_WEBSOCKET_AUTH_TOKEN_FILE: /app/fincast-auth/token
      AI_WEBSOCKET_GENERATE_AUTH_TOKEN: ${AI_FINCAST_WEBSOCKET_GENERATE_AUTH_TOKEN:-true}
      AI_WEBSOCKET_MAX_CONNECTIONS: ${AI_FINCAST_WEBSOCKET_MAX_CONNECTIONS:-4}
      AI_WEBSOCKET_QUEUE_CAPACITY: ${AI_FINCAST_WEBSOCKET_QUEUE_CAPACITY:-4}
      AI_WEBSOCKET_MAX_IN_FLIGHT: "1"
      AI_WEBSOCKET_PING_INTERVAL_SECONDS: ${AI_WEBSOCKET_PING_INTERVAL_SECONDS:-20}
      AI_WEBSOCKET_PING_TIMEOUT_SECONDS: ${AI_WEBSOCKET_PING_TIMEOUT_SECONDS:-20}
      AI_WEBSOCKET_CLOSE_TIMEOUT_SECONDS: ${AI_WEBSOCKET_CLOSE_TIMEOUT_SECONDS:-10}
      AI_WEBSOCKET_TLS_CERT_FILE: ${AI_FINCAST_WEBSOCKET_TLS_CERT_FILE:-}
      AI_WEBSOCKET_TLS_KEY_FILE: ${AI_FINCAST_WEBSOCKET_TLS_KEY_FILE:-}
      AI_MODEL_CACHE_DIR: /models
      AI_MODEL_MANIFEST: /app/model-manifest.json
      AI_MODEL_LANE: fincast
      AI_DEVICE: ${AI_DEVICE:-cuda}
      AI_ALLOW_CPU_FALLBACK: "false"
      AI_EXPECTED_CUDA_CAPABILITY: ${AI_EXPECTED_CUDA_CAPABILITY:-6.1}
      AI_EXPECTED_CUDA_DEVICE_NAME: ${AI_EXPECTED_CUDA_DEVICE_NAME:-Tesla P40}
      AI_MICROBATCH_SIZE: "4"
      AI_CROSS_REQUEST_MICROBATCH: ${AI_CROSS_REQUEST_MICROBATCH:-false}
      AI_MAX_SERIES: ${AI_FINCAST_MAX_SERIES:-50}
      AI_MAX_EVALUATION_ORIGINS: ${AI_MAX_EVALUATION_ORIGINS:-10000}
      AI_MIN_CONTEXT_BARS: "512"
      AI_MAX_CONTEXT_BARS: "512"
      AI_FINCAST_CONTEXT_BARS: "512"
      AI_FINCAST_RAW_BACKEND: ${AI_FINCAST_RAW_BACKEND:-cuda_graph}
      AI_FINCAST_RAW_BATCH_15: ${AI_FINCAST_RAW_BATCH_15:-48}
      AI_FINCAST_RAW_BATCH_30: ${AI_FINCAST_RAW_BATCH_30:-48}
      AI_FINCAST_RAW_BATCH_60: ${AI_FINCAST_RAW_BATCH_60:-48}
      AI_FINCAST_MIN_VRAM_HEADROOM_MIB: ${AI_FINCAST_MIN_VRAM_HEADROOM_MIB:-2048}
      AI_FINCAST_NVML_DEVICE_INDEX: ${AI_FINCAST_NVML_DEVICE_INDEX:-0}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-67108864}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-134217728}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      CUDA_MODULE_LOADING: LAZY
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Asia/Seoul
    init: true
    restart: unless-stopped
    read_only: true
    expose:
      - "8766"
    networks:
      - ai_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${AI_FINCAST_MODEL_CACHE_SOURCE:-ai_model_cache}:/models:ro
      - ${AI_FINCAST_AUTH_SECRET_SOURCE:-fincast_auth}:/app/fincast-auth
      - ${AI_FINCAST_TLS_SECRET_SOURCE:-ai_tls}:/run/ai-tls:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/portfolio-ai-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  chronos2-worker:
    # Explicit profile because the production instance normally runs on the
    # remote P40 host. Strategy routing, not this profile, selects its role.
    profiles: ["chronos2"]
    image: ${AI_CHRONOS2_WORKER_IMAGE:-toss-portfolio-lens-chronos2-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker.chronos2
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    command: ["serve"]
    environment:
      AI_WEBSOCKET_HOST: 0.0.0.0
      AI_WEBSOCKET_PORT: "8767"
      AI_WEBSOCKET_PATH: /ws/scalping-ai/v2
      AI_WEBSOCKET_AUTH_TOKEN_FILE: /app/chronos2-auth/token
      AI_WEBSOCKET_GENERATE_AUTH_TOKEN: ${AI_CHRONOS2_WEBSOCKET_GENERATE_AUTH_TOKEN:-true}
      AI_WEBSOCKET_MAX_CONNECTIONS: ${AI_CHRONOS2_WEBSOCKET_MAX_CONNECTIONS:-4}
      AI_WEBSOCKET_QUEUE_CAPACITY: ${AI_CHRONOS2_WEBSOCKET_QUEUE_CAPACITY:-4}
      AI_WEBSOCKET_MAX_IN_FLIGHT: "1"
      AI_MODEL_CACHE_DIR: /models
      AI_MODEL_MANIFEST: /app/model-manifest.json
      AI_MODEL_LANE: chronos_2
      AI_DEVICE: ${AI_DEVICE:-cuda}
      AI_ALLOW_CPU_FALLBACK: "false"
      AI_EXPECTED_CUDA_CAPABILITY: ${AI_EXPECTED_CUDA_CAPABILITY:-6.1}
      AI_EXPECTED_CUDA_DEVICE_NAME: ${AI_EXPECTED_CUDA_DEVICE_NAME:-Tesla P40}
      AI_MICROBATCH_SIZE: ${AI_CHRONOS2_MICROBATCH_SIZE:-4}
      AI_CROSS_REQUEST_MICROBATCH: ${AI_CROSS_REQUEST_MICROBATCH:-false}
      AI_MAX_SERIES: ${AI_CHRONOS2_MAX_SERIES:-50}
      AI_MAX_EVALUATION_ORIGINS: ${AI_MAX_EVALUATION_ORIGINS:-10000}
      AI_MIN_CONTEXT_BARS: "1024"
      AI_MAX_CONTEXT_BARS: "8192"
      AI_CHRONOS2_CONTEXT_BARS: "1024"
      AI_CHRONOS2_INPUT_PROFILE: ${AI_CHRONOS2_INPUT_PROFILE:-compact_causal_v1}
      AI_CHRONOS2_BATCH_SIZE: ${AI_CHRONOS2_BATCH_SIZE:-32}
      AI_CHRONOS2_INFERENCE_BACKEND: ${AI_CHRONOS2_INFERENCE_BACKEND:-cuda_graph}
      AI_CHRONOS2_RAW_BACKEND: ${AI_CHRONOS2_RAW_BACKEND:-gpu_gather}
      AI_CHRONOS2_RAW_BATCH: ${AI_CHRONOS2_RAW_BATCH:-32}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-67108864}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-134217728}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      CUDA_MODULE_LOADING: LAZY
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Asia/Seoul
    init: true
    restart: unless-stopped
    read_only: true
    expose:
      - "8767"
    networks:
      - ai_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${AI_CHRONOS2_MODEL_CACHE_SOURCE:-chronos2_model_cache}:/models:ro
      - ${AI_CHRONOS2_AUTH_SECRET_SOURCE:-chronos2_auth}:/app/chronos2-auth
      - ${AI_CHRONOS2_TLS_SECRET_SOURCE:-ai_tls}:/run/ai-tls:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/portfolio-ai-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  portfolio_data:
  compute_socket:
  fincast_auth:
  chronos2_auth:
  ai_model_cache:
  chronos2_model_cache:
  ai_tls:

networks:
  ai_internal:
    internal: true
