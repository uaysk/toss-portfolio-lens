apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-backup-retention
  namespace: pg
  labels:
    app.kubernetes.io/part-of: toss-portfolio-lens
    app.kubernetes.io/component: postgres-backup
imagePullSecrets:
  - name: harbor-pull-toss-portfolio-lens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg-backup-retention
  namespace: pg
  labels:
    app.kubernetes.io/part-of: toss-portfolio-lens
    app.kubernetes.io/component: postgres-backup
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg-backup-retention
  namespace: pg
  labels:
    app.kubernetes.io/part-of: toss-portfolio-lens
    app.kubernetes.io/component: postgres-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg-backup-retention
subjects:
  - kind: ServiceAccount
    name: cnpg-backup-retention
    namespace: pg
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-prod-block-snapshot-daily
  namespace: pg
  labels:
    app.kubernetes.io/part-of: toss-portfolio-lens
    app.kubernetes.io/component: postgres-backup
  annotations:
    backup.cnpg.io/volumeSnapshotDeadline: "30"
spec:
  schedule: "0 17 18 * * *"
  backupOwnerReference: none
  cluster:
    name: pg-prod-block
  method: volumeSnapshot
  target: prefer-standby
  online: true
  onlineConfiguration:
    immediateCheckpoint: true
    waitForArchive: true
  immediate: true
  suspend: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnpg-backup-retention
  namespace: pg
  labels:
    app.kubernetes.io/part-of: toss-portfolio-lens
    app.kubernetes.io/component: postgres-backup
spec:
  schedule: "10 4 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: toss-portfolio-lens
            app.kubernetes.io/component: postgres-backup
        spec:
          serviceAccountName: cnpg-backup-retention
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: harbor.uaysk.com/toss-portfolio-lens/cnpg-backup-retention@sha256:0146b529063ccbfe3831f18ac1d94216cf834324545ec641b82fac131ee8003b
              imagePullPolicy: IfNotPresent
              env:
                - name: BACKUP_NAMESPACE
                  value: pg
                - name: SCHEDULE_NAME
                  value: pg-prod-block-snapshot-daily
                - name: KEEP_COMPLETED
                  value: "7"
                - name: RETENTION_DRY_RUN
                  value: "false"
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
