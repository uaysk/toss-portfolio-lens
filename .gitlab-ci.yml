include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Keep the change classifier explicit so it can be copied to other repositories.
# A code-sensitive job runs for any non-docs change; docs-only changes use the
# lightweight documentation validation job below. Main, tags, and schedules are
# always complete validation boundaries.
.ci-code-paths: &ci_code_paths
  - .gitlab-ci.yml
  - .gitlab/**/*
  - .dockerignore
  - .semgrepignore
  - Dockerfile*
  - package.json
  - package-lock.json
  - tsconfig*.json
  - vite.config.*
  - postcss.config.*
  - tailwind.config.*
  - Cargo.toml
  - Cargo.lock
  - worker/**/*
  - server/**/*
  - src/**/*
  - public/**/*
  - scripts/**/*
  - test-support/**/*
  - qualification-tools/**/*
  - infra/**/*
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.mjs'
  - '**/*.cjs'
  - '**/*.sh'
  - '**/*.rs'
  - '**/*.go'
  - '**/*.css'
  - '**/*.html'

.ci-doc-paths: &ci_doc_paths
  - docs/**/*
  - '**/*.md'
  - '*.md'
  - LICENSE*

.ci-code-sensitive-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
    - changes: *ci_code_paths
    - changes: *ci_doc_paths
      when: never
    - when: on_success

.ci-docs-only-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      when: never
    - changes: *ci_code_paths
      when: never
    - changes: *ci_doc_paths
    - when: never

.ci-resource-metrics-script: &ci_resource_metrics_script |
  ci_record_resource_metrics() {
    local job_status="$1"
    local memory_peak_bytes memory_current_bytes memory_events cpu_usage_usec io_bytes
    memory_peak_bytes="$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || true)"
    memory_current_bytes="$(cat /sys/fs/cgroup/memory.current 2>/dev/null || true)"
    memory_events="$(tr '\n' ',' < /sys/fs/cgroup/memory.events 2>/dev/null | sed 's/,$//' || true)"
    cpu_usage_usec="$(awk '$1 == "usage_usec" { print $2 }' /sys/fs/cgroup/cpu.stat 2>/dev/null || true)"
    io_bytes="$(awk '{ for (field = 1; field <= NF; field += 1) if ($field ~ /^rbytes=|^wbytes=/) { split($field, pair, "="); total += pair[2] } } END { print total + 0 }' /sys/fs/cgroup/io.stat 2>/dev/null || true)"
    printf 'ci-resource-metrics scope=job-script job=%s runner=%s status=%s memory_peak_bytes=%s memory_current_bytes=%s cpu_usage_usec=%s io_bytes=%s memory_events=%s\n' \
      "${CI_JOB_NAME:-unknown}" "${CI_RUNNER_ID:-unknown}" "$job_status" \
      "${memory_peak_bytes:-unknown}" "${memory_current_bytes:-unknown}" \
      "${cpu_usage_usec:-unknown}" "${io_bytes:-unknown}" "${memory_events:-unknown}" >&2
    return "$job_status"
  }
  trap 'ci_record_resource_metrics "$?"' EXIT

stages:
  - preflight
  - validate
  - test
  - integration
  - release-preflight
  - release

default:
  tags:
    - toss-portfolio-lens-docker
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - server_timeout_running

variables:
  GIT_DEPTH: "20"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/worker/rust/target"
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: "always"
  AST_ENABLE_MR_PIPELINES: "true"
  SAST_EXCLUDED_PATHS: "spec,test,tests,tmp,graphify-out,docs/reports,.cache,dist,node_modules,qualification-tools,worker/rust/target"

runner-boundary:
  stage: preflight
  image: node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
  timeout: 5 minutes
  variables:
    GIT_STRATEGY: none
  before_script:
    - *ci_resource_metrics_script
  script:
    - mkdir -p .cache/performance
    - |
      memory_max="$(cat /sys/fs/cgroup/memory.max)"
      test "$memory_max" != "max"
      test "$memory_max" -le 5368709120
      test ! -S /var/run/docker.sock
      test -z "$(find /dev -maxdepth 1 -name 'nvidia*' -print -quit)"
      printf '{"memoryMaxBytes":%s,"dockerSocketExposed":false,"gpuDeviceExposed":false}\n' "$memory_max" \
        > .cache/performance/runner-boundary.json
  artifacts:
    expire_in: 30 days
    paths:
      - .cache/performance/runner-boundary.json

.node-job:
  image: node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
  before_script:
    - *ci_resource_metrics_script
    - npm ci --prefer-offline --no-audit --no-fund
  cache:
    - key:
        files:
          - package-lock.json
        prefix: node-npm-v2
      policy: pull
      paths:
        - .cache/npm/

node-static:
  extends: .node-job
  stage: validate
  timeout: 25 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules: !reference [.ci-code-sensitive-rules, rules]
  before_script:
    - *ci_resource_metrics_script
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git >/dev/null
    - npm ci --prefer-offline --no-audit --no-fund
  cache:
    - key:
        files:
          - package-lock.json
        prefix: node-npm-v2
      policy: pull-push
      paths:
        - .cache/npm/
    - key:
        files:
          - package-lock.json
        prefix: node-build-v2
      policy: pull-push
      paths:
        - .cache/types/
        - .cache/tsbuildinfo/
        - dist/server/
  script:
    - npm run test:release-tools
    - |
      qualification_output="$(mktemp -d)"
      QUALIFICATION_TOOLS_OUTPUT="$qualification_output" npm run qualification:chronos2:tools
      node scripts/verify-qualification-tools.mjs "$qualification_output"
      rm -rf "$qualification_output"
    - npm run typecheck:app
    - npm run build:client
    - npm run build:server
    - npm run check:bundle
    - npm run check:legacy
    - |
      if ! npm run typecheck:tools > typescript-diagnostics.txt 2>&1; then
        cat typescript-diagnostics.txt
        exit 1
      fi
      cat typescript-diagnostics.txt
    - npm run docs:mcp:check
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - typescript-diagnostics.txt
      - .cache/performance/bundle-report.json

docs-validation:
  extends: .node-job
  stage: validate
  timeout: 10 minutes
  dependencies: []
  rules: !reference [.ci-docs-only-rules, rules]
  script:
    - npm run docs:mcp:check

vitest-light:
  extends: .node-job
  stage: test
  timeout: 25 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules: !reference [.ci-code-sensitive-rules, rules]
  variables:
    VITEST_MEMORY_BUDGET_MB: "3584"
    VITEST_MAX_PARALLEL: "2"
    VITEST_JUNIT_DIR: "$CI_PROJECT_DIR/.cache/test-reports/vitest-light"
  script:
    - npm run test:light
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .cache/performance/vitest-batches.json
      - .cache/test-reports/vitest-light/
    reports:
      junit: .cache/test-reports/vitest-light/*.xml

vitest-heavy:
  extends: .node-job
  stage: test
  timeout: 30 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules: !reference [.ci-code-sensitive-rules, rules]
  variables:
    VITEST_MEMORY_BUDGET_MB: "2048"
    VITEST_MAX_PARALLEL: "1"
    VITEST_JUNIT_DIR: "$CI_PROJECT_DIR/.cache/test-reports/vitest-heavy"
  script:
    - npm run test:heavy
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .cache/performance/vitest-batches.json
      - .cache/test-reports/vitest-heavy/
    reports:
      junit: .cache/test-reports/vitest-heavy/*.xml

vitest-pglite:
  extends: .node-job
  stage: test
  timeout: 35 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules: !reference [.ci-code-sensitive-rules, rules]
  variables:
    VITEST_MEMORY_BUDGET_MB: "4096"
    VITEST_MAX_PARALLEL: "1"
    VITEST_PGLITE_MAX_PARALLEL: "2"
    VITEST_PGLITE_SERIAL_FILES: "server/services/run-service.test.ts"
    VITEST_JUNIT_DIR: "$CI_PROJECT_DIR/.cache/test-reports/vitest-pglite"
  script:
    - npm run test:pglite
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .cache/performance/vitest-batches.json
      - .cache/test-reports/vitest-pglite/
    reports:
      junit: .cache/test-reports/vitest-pglite/*.xml

vitest-coverage:
  extends: .node-job
  stage: test
  timeout: 35 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  variables:
    VITEST_MEMORY_BUDGET_MB: "3072"
    VITEST_MAX_PARALLEL: "1"
    VITEST_COVERAGE_DIR: "$CI_PROJECT_DIR/.cache/coverage/vitest-light"
    VITEST_JUNIT_DIR: "$CI_PROJECT_DIR/.cache/test-reports/vitest-coverage"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *ci_code_paths
    - when: never
  script:
    - npm run test:light
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .cache/coverage/vitest-light/
      - .cache/performance/vitest-batches.json
    reports:
      junit: .cache/test-reports/vitest-coverage/*.xml
      coverage_report:
        coverage_format: cobertura
        path: .cache/coverage/vitest-light/cobertura-coverage.xml

semgrep-sast:
  image: registry.gitlab.com/security-products/semgrep:6@sha256:69d311ec0f712f054aa0ea1cb47a5a2bfde6bb7c36d77144c9e189eec83dfa8f
  timeout: 25 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules: !reference [.ci-code-sensitive-rules, rules]
  variables:
    SAST_SCANNER_ALLOWED_CLI_OPTS: "--timeout 15"
  before_script:
    - *ci_resource_metrics_script

secret_detection:
  image: registry.gitlab.com/security-products/secrets:7@sha256:67653ece880ca76f6e6a468fee1923d59b0f48138aee06199208b4b2bec478ff
  timeout: 15 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules: !reference [.ci-code-sensitive-rules, rules]
  before_script:
    - *ci_resource_metrics_script

rust-quality:
  stage: test
  image: rust:1.97-bookworm@sha256:77fac8b98f9f46062bb680b6d25d5bcaabfc400143952ebc572e924bcbedc3fa
  timeout: 35 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
      variables:
        RUST_CACHE_POLICY: pull-push
    - changes: *ci_code_paths
    - changes: *ci_doc_paths
      when: never
    - when: on_success
  variables:
    CARGO_INCREMENTAL: "0"
    RUST_CACHE_POLICY: pull
  cache:
    - key:
        files:
          - worker/rust/Cargo.lock
        prefix: rust-registry-v2
      policy: $RUST_CACHE_POLICY
      paths:
        - .cache/cargo/registry/
        - .cache/cargo/git/
    - key:
        files:
          - worker/rust/Cargo.lock
        prefix: rust-target-v2
      policy: $RUST_CACHE_POLICY
      paths:
        - worker/rust/target/
  before_script:
    - *ci_resource_metrics_script
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --check --manifest-path worker/rust/Cargo.toml
    - cargo clippy --all-targets --locked --manifest-path worker/rust/Cargo.toml -- -D warnings
    - cargo test --locked --manifest-path worker/rust/Cargo.toml -- --test-threads=2
    - cargo build --release --locked --manifest-path worker/rust/Cargo.toml
    - INDICATOR_BENCH_OUTPUT=.cache/performance/rust-indicator-cache.json cargo run --release --locked --manifest-path worker/rust/Cargo.toml --example indicator_cache_benchmark
  artifacts:
    expire_in: 7 days
    paths:
      - worker/rust/target/release/portfolio-lens-worker
      - .cache/performance/rust-indicator-cache.json

cnpg-backup-retention:
  stage: test
  image: golang:1.26.5-alpine3.23@sha256:73f9732658b30852522ee5ebe698daa27e1829add9a70ff4f4a828409f8d0a99
  timeout: 10 minutes
  before_script:
    - *ci_resource_metrics_script
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - infra/homelab/cnpg-backup-retention/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: never
  script:
    - cd infra/homelab/cnpg-backup-retention
    - go test ./...
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w -buildid=' -o cnpg-backup-retention .

ui-regression:
  extends: .node-job
  stage: test
  image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
  timeout: 25 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  dependencies: []
  rules: !reference [.ci-code-sensitive-rules, rules]
  variables:
    UI_VALIDATION_SKIP_BUILD: "1"
    UI_VALIDATION_SCREENSHOT_DIR: "$CI_PROJECT_DIR/.cache/ui-regression"
  script:
    - npm run build:client
    - npm run test:ui-regression
    - |
      if [[ -d "$UI_VALIDATION_SCREENSHOT_DIR" ]]; then
        find "$UI_VALIDATION_SCREENSHOT_DIR" -type f -name '*.png' -delete
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .cache/ui-regression/

postgres-integration:
  extends: .node-job
  stage: integration
  timeout: 30 minutes
  resource_group: toss-portfolio-lens-memory-heavy
  rules: !reference [.ci-code-sensitive-rules, rules]
  before_script:
    - *ci_resource_metrics_script
    - apt-get update -qq
    - apt-get install -y --no-install-recommends libssl3 >/dev/null
    - npm ci --prefer-offline --no-audit --no-fund
  needs:
    - job: rust-quality
      artifacts: true
  services:
    - name: postgres:17-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
  variables:
    NODE_ENV: test
    HOST: 127.0.0.1
    CLIENT_ID: ci-client
    CLIENT_SECRET: ci-client-secret
    DASHBOARD_PASSWORD: ci-dashboard-password
    READ_ONLY_API_TOKEN: ci-read-only-api-token
    SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: portfolio_lens_test
    POSTGRES_USER: portfolio_test
    POSTGRES_PASSWORD: integration-password
    POSTGRES_DATABASE: portfolio_lens_test
    POSTGRES_TEST_HOST: postgres
    POSTGRES_TEST_PORT: "5432"
    POSTGRES_TEST_USER: portfolio_test
    POSTGRES_TEST_PASSWORD: integration-password
    POSTGRES_TEST_DATABASE: portfolio_lens_test
    SCALPING_ENABLED: "false"
    MCP_ENABLED: "false"
    AI_FINCAST_COMPUTE_AUTH_TOKEN_FILE: /run/fincast-auth/token
  script:
    - npm run test:rust-worker
    - npm run test:postgres
    - npm run test:worker-queue
    - npm run test:rust-worker-postgres

security-report-gate:
  stage: integration
  image: node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
  timeout: 5 minutes
  needs:
    - job: semgrep-sast
      artifacts: true
    - job: secret_detection
      artifacts: true
  before_script:
    - *ci_resource_metrics_script
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
    - changes: *ci_code_paths
    - changes: *ci_doc_paths
      when: never
    - when: on_success
  script:
    - node scripts/check-gitlab-security-reports.mjs
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - .cache/security/gitlab-security-summary.json

release-preflight:
  stage: release-preflight
  tags:
    - toss-portfolio-lens-release
  timeout: 10 minutes
  interruptible: false
  retry: 0
  resource_group: toss-portfolio-lens-production
  dependencies: []
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - bash scripts/ci-release-production.sh --preflight-only
  artifacts:
    when: always
    access: developer
    expire_in: 90 days
    paths:
      - .cache/release/preflight.json

release-production:
  stage: release
  tags:
    - toss-portfolio-lens-release
  timeout: 60 minutes
  interruptible: false
  retry: 0
  resource_group: toss-portfolio-lens-production
  dependencies: []
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_DEPLOY_FREEZE'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  environment:
    name: production
    url: https://tpl.uaysk.com
    deployment_tier: production
  script:
    - bash scripts/ci-release-production.sh
  artifacts:
    when: always
    access: developer
    expire_in: 90 days
    paths:
      - .cache/release/preflight.json
      - .cache/release/candidate.env
      - .cache/release/web-build-metadata.json
      - .cache/release/rust-build-metadata.json
      - .cache/release/deployment-report.json
      - .cache/security/harbor-trivy-web.json
      - .cache/security/harbor-trivy-rust-worker.json

publish-gitlab-release:
  stage: release
  tags:
    - toss-portfolio-lens-release
  timeout: 5 minutes
  interruptible: false
  retry: 0
  needs:
    - job: release-production
      artifacts: true
  variables:
    GIT_STRATEGY: none
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - node scripts/create-gitlab-release-notes.mjs
  release:
    name: "Production $CI_COMMIT_SHORT_SHA"
    description: .cache/release/gitlab-release.md
    tag_name: "production-$CI_COMMIT_SHA"
    ref: "$CI_COMMIT_SHA"
  artifacts:
    expire_in: 90 days
    paths:
      - .cache/release/gitlab-release.md
