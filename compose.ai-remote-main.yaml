services:
  web:
    environment:
      AI_COMPUTE_URL: ${AI_COMPUTE_URL:?set AI_COMPUTE_URL to the remote FinCast wss URL or an explicitly allowed private-LAN ws URL}
      AI_FINCAST_COMPUTE_URL: ${AI_FINCAST_COMPUTE_URL:-${AI_COMPUTE_URL:?set AI_COMPUTE_URL or AI_FINCAST_COMPUTE_URL to the FinCast remote URL}}
      # Kronos-base is an optional legacy lane and must never inherit the
      # generic FinCast endpoint.
      AI_KRONOS_COMPUTE_URL: ${AI_KRONOS_COMPUTE_URL:-}
      AI_COMPUTE_ALLOW_INSECURE_PRIVATE_WS: ${AI_COMPUTE_ALLOW_INSECURE_PRIVATE_WS:-false}
  ai-worker:
    profiles: !override ["local-ai-disabled"]
  fincast-worker:
    profiles: !override ["local-ai-disabled"]
