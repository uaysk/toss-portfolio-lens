services:
  web:
    environment:
      AI_COMPUTE_URL: ${AI_COMPUTE_URL:?set AI_COMPUTE_URL to the remote wss URL or an explicitly allowed private-LAN ws URL}
      AI_KRONOS_COMPUTE_URL: ${AI_KRONOS_COMPUTE_URL:-${AI_COMPUTE_URL:?set AI_COMPUTE_URL or AI_KRONOS_COMPUTE_URL to the Kronos remote URL}}
      # Empty keeps the first Kronos-only release valid. FinCast becomes a
      # separately configured lane only after its GPU worker is qualified.
      AI_FINCAST_COMPUTE_URL: ${AI_FINCAST_COMPUTE_URL:-}
      AI_COMPUTE_ALLOW_INSECURE_PRIVATE_WS: ${AI_COMPUTE_ALLOW_INSECURE_PRIVATE_WS:-false}
  ai-worker:
    profiles: !override ["local-ai-disabled"]
  fincast-worker:
    profiles: !override ["local-ai-disabled"]
