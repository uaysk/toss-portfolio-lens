services:
  web:
    environment:
      AI_FINCAST_COMPUTE_URL: ${AI_FINCAST_COMPUTE_URL:?set AI_FINCAST_COMPUTE_URL to the remote FinCast URL}
      AI_CHRONOS2_COMPUTE_URL: ${AI_CHRONOS2_COMPUTE_URL:?set AI_CHRONOS2_COMPUTE_URL to the remote Chronos-2 URL}
      AI_FINCAST_COMPUTE_ALLOW_INSECURE_PRIVATE_WS: ${AI_FINCAST_COMPUTE_ALLOW_INSECURE_PRIVATE_WS:-false}
      AI_CHRONOS2_COMPUTE_ALLOW_INSECURE_PRIVATE_WS: ${AI_CHRONOS2_COMPUTE_ALLOW_INSECURE_PRIVATE_WS:-false}
  fincast-worker:
    profiles: !override ["local-ai-disabled"]
  chronos2-worker:
    profiles: !override ["local-ai-disabled"]
